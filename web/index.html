<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMAC Prep</title>
  <meta name="description" content="Préparez vos rendez-vous commerciaux avec la méthode SIMAC et le profil SONCAS — gratuit, sans serveur, IA au choix.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Ctext x='16' y='22' font-size='17' font-family='system-ui' font-weight='700' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">S</span> SIMAC Prep <span class="tag">TPE / PME</span></div>
    <div class="topbar-right">
      <span id="provider-badge" class="badge">—</span>
      <button id="btn-new" class="btn ghost" title="Nouveau rendez-vous">+ Nouveau RDV</button>
    </div>
  </header>

  <div class="layout">
    <nav class="steps" id="steps">
      <button data-step="offer"><span class="n">1</span><span><b>Offre</b><small>Produit ou service</small></span></button>
      <button data-step="client"><span class="n">2</span><span><b>Client</b><small>Se renseigner</small></span></button>
      <button data-step="persona"><span class="n">3</span><span><b>Persona</b><small>SONCAS &amp; message</small></span></button>
      <button data-step="simac"><span class="n">4</span><span><b>SIMAC</b><small>Déroulé &amp; objections</small></span></button>
      <button data-step="followup"><span class="n">5</span><span><b>Suivi</b><small>Débrief &amp; CTA</small></span></button>
      <hr>
      <button data-step="history"><span class="n">≡</span><span><b>Historique</b><small>Mémoire &amp; CSV</small></span></button>
      <button data-step="settings"><span class="n">⚙</span><span><b>Réglages</b><small>IA gratuite</small></span></button>
    </nav>

    <main id="main" class="panel"></main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
